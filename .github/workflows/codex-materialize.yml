name: Materialize verified Sol model changes
on:
  push:
    branches: [codex/chatgpt-sol61-tutor-defaults]
permissions:
  contents: write
jobs:
  materialize:
    if: github.event.head_commit.message == 'Prepare verified Sol model changes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/chatgpt-sol61-tutor-defaults
          fetch-depth: 0
      - name: Apply and verify tested file deltas
        run: python3 .codex-materialize.py
      - name: Commit final files and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Default to ChatGPT Sol for text, vision and reasoning with Gemini and Kimi backups'
          git push origin HEAD:codex/chatgpt-sol61-tutor-defaults
