name: App checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline scripts
        run: node tools/check-syntax.mjs
      - name: Check tutoring, key readiness and live behaviour
        run: node --test tools/*-tests.mjs
      - name: Verify the function dependency lock with the deployment runtime
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Check tutoring and adventure functions
        run: node --test functions/test/*.test.js
  adventure-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check adventure layouts and interactions
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/adventure-browser-check.mjs
      - name: Check prepared tutoring, streaming and interruptions
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/fast-tutor-browser-check.mjs
      - name: Check answer-key discovery and hidden-page recovery
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/answer-key-browser-check.mjs
      - name: Check centre student creation, access and practice sessions
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/centre-admin-browser-check.mjs
      - name: Check worksheet-level tutoring and practice guidance
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/learner-guidance-browser-check.mjs
      - name: Check public sample worksheets and microphone cleanup
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/sample-browser-check.mjs
      - name: Check the consult call, the teacher's ink and the pop-up
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/consult-browser-check.mjs
      - name: Check the marking reads every page, from the PDF, side by side
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/marking-browser-check.mjs
      - name: Check a boxed part of the page reaches the tutor
        env:
          PW: ./node_modules/playwright/index.mjs
        run: node tools/snip-browser-check.mjs
